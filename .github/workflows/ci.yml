name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      # ContentSecurityPolicies.php uses PHP 8.1 enums; it is only loaded on TYPO3 v12+
      - name: Lint PHP files
        run: |
          find . -name '*.php' -not -path './dev/*' -not -path './vendor/*' \
            $( [ "${{ matrix.php }}" \< "8.1" ] && echo "-not -name ContentSecurityPolicies.php" ) \
            -print0 | xargs -0 -n1 php -l
      - name: Validate composer.json
        if: matrix.php == '8.4'
        run: composer validate --strict --no-check-lock

  xliff:
    name: XLIFF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - run: xmllint --noout Resources/Private/Language/*.xlf

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render documentation (fails on warnings)
        run: |
          docker run --rm -v "$PWD":/project ghcr.io/typo3-documentation/render-guides:latest \
            --config=Documentation --fail-on-log
