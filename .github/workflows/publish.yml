name: Publish to TER

# Publishes a release to the TYPO3 Extension Repository when a version tag (e.g. 1.0.1) is pushed.
# Requires the repository secret TYPO3_API_TOKEN (extensions.typo3.org > My Extensions > Access Tokens).
# Packagist picks up the same tag through its GitHub webhook.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TYPO3_EXTENSION_KEY: klimadashboard
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that ext_emconf.php matches the tag
        run: |
          version="${GITHUB_REF_NAME}"
          grep -q "'version' => '${version}'" ext_emconf.php \
            || { echo "ext_emconf.php version does not match tag ${version}" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_ENV"

      - name: Get the release comment from the tag message
        run: |
          comment=$(git tag -n99 -l "${version}" | sed "s/^${version}[ ]*//")
          if [ -z "${comment// }" ]; then comment="Release ${version}, see CHANGELOG.md"; fi
          {
            echo "comment<<EOF"
            echo "${comment}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress

      - name: Publish to TER
        run: php ~/.composer/vendor/bin/tailor ter:publish --comment "${comment}" "${version}"
